name: Pyroscope - coordinated-workers deployment validator
probes:
  - name: Cluster consistency
    type: scriptlet
    url: github://canonical/cos-coordinated-workers//probes/cluster_consistency.py
    with:
      - worker_charm: pyroscope-worker-k8s
        # Recommended scale per role for a highly-available, distributed
        # deployment, following upstream Pyroscope's v2 microservices values.
        # The metastore is the only stateful (Raft) role, so it must run an odd
        # number of units (>= 3) to keep a quorum.
        recommended_deployment:
          query-frontend: 2
          query-backend: 3
          distributor: 2
          segment-writer: 3
          metastore: 3
          compaction-worker: 3
          tenant-settings: 1
          ad-hoc-profiles: 1
        meta_roles:
          all: [query-frontend, query-backend, distributor, segment-writer, metastore, compaction-worker, tenant-settings, ad-hoc-profiles]
