[project]
name = "pyroscope-k8s"
version = "0.1"  # this is in fact irrelevant
requires-python = "~=3.12.0"


[project.optional-dependencies]
dev = [
    #INTEGRATION TESTS
    "jubilant",
    "pytest-jubilant~=1.0",
    "requests",
    "tenacity",
    "sh",
    "pytest-bdd",
    # for scripts/profilegen.py
    "grpcio",
    "protobuf",
    # 1.43.0 is the first release whose Sample field numbers match the Go module
    # pyroscope v2 parses with; see scripts/profilegen.py.
    "opentelemetry-proto>=1.43.0",
]


[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
markers = ["setup", "teardown"]


